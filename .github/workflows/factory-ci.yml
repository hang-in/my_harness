# 팩토리 정본(skills/myharness) 검증 — 정책 감사 + 업데이트 회귀 테스트를 Linux/Windows 양쪽에서.
# harness-ui 는 ci.yml(harness-ui-ci)이 담당한다. 파일명이 겹치면 서로를 덮으므로 분리한다.
name: factory-ci

on:
  push:
    # branches 와 tags-ignore 를 함께 선언해야 한다(req).
    # GitHub 규약: "If you define only tags/tags-ignore or only branches/branches-ignore,
    # the workflow won't run for events affecting the undefined Git ref."
    # 즉 tags-ignore 만 두면 브랜치 push 검증이 통째로 사라진다.
    # 태그를 제외하는 이유는 태그 push 에 paths 필터가 평가되지 않아 전건 실행되기 때문이다.
    branches: ["**"]
    tags-ignore: ["**"]
    paths:
      - "skills/**"
      - "tests/**"
      - "install.sh"
      - "install.ps1"
      - ".claude-plugin/**"
      - ".github/workflows/factory-ci.yml"
      # 정책 감사가 직접 읽는 대상: README 3종·CHANGELOG(버전 정합), AGENTS.md·CLAUDE.md(진입점),
      # CONTRIBUTING.md(명령 경로), .gitattributes(LF 정책), .claude/commands(생성 금지 원칙).
      - ".claude/commands/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - ".gitattributes"
      # 자가호스팅 하네스 산출물과 allowlist 도 감사 대상이다.
      # 이것만 바뀐 PR 이 CI 를 전혀 안 거치던 구멍을 막는다.
      - ".gitignore"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
  pull_request:
    paths:
      - "skills/**"
      - "tests/**"
      - "install.sh"
      - "install.ps1"
      - ".claude-plugin/**"
      - ".github/workflows/factory-ci.yml"
      # 정책 감사가 직접 읽는 대상: README 3종·CHANGELOG(버전 정합), AGENTS.md·CLAUDE.md(진입점),
      # CONTRIBUTING.md(명령 경로), .gitattributes(LF 정책), .claude/commands(생성 금지 원칙).
      - ".claude/commands/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - ".gitattributes"
      # 자가호스팅 하네스 산출물과 allowlist 도 감사 대상이다.
      # 이것만 바뀐 PR 이 CI 를 전혀 안 거치던 구멍을 막는다.
      - ".gitignore"
      - ".claude/**"
      - ".codex/**"
      - ".agents/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Policy audit
        run: bash skills/myharness/scripts/run-policy-audit.sh
      - name: Harness update regression tests
        run: bash tests/test-harness-update.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
          }
      - name: Verify shell script line endings
        shell: pwsh
        run: |
          $bad = git ls-files --eol -- '*.sh' | Where-Object {
            $_ -match 'w/(crlf|mixed)'
          }
          if ($bad) {
            $bad | Write-Error
            exit 1
          }
      - name: Test Windows installer
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'myharness-install'
          $codexHome = Join-Path $testRoot 'codex'
          $projectRoot = Join-Path $testRoot 'project'
          $projectSkillParent = Join-Path $projectRoot '.agents\skills'
          New-Item -ItemType Directory -Force -Path $projectSkillParent | Out-Null
          Set-Content `
            -LiteralPath (Join-Path $projectSkillParent 'myharness') `
            -Value '../../skills/myharness' `
            -NoNewline
          & .\install.ps1 `
            -CodexHome $codexHome `
            -ProjectRoot $projectRoot `
            -SourceRoot (Resolve-Path .\skills\myharness)
          if (-not (Test-Path (Join-Path $codexHome 'skills\myharness\SKILL.md'))) {
            throw 'Global Codex skill was not installed.'
          }
          if (-not (Test-Path (Join-Path $projectRoot '.agents\skills\myharness\SKILL.md'))) {
            throw 'Project Codex skill was not installed.'
          }
      - name: Policy audit
        shell: bash
        run: bash skills/myharness/scripts/run-policy-audit.sh
      - name: Harness update regression tests
        shell: bash
        run: bash tests/test-harness-update.sh
